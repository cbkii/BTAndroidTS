syntax = "proto3";

package btandroidts;

option java_package = "com.cbkii.btandroidts.data.datastore";
option java_multiple_files = true;

message OppHistoryPreferences {
  repeated OppHistoryItemPreference history_items = 1;
}

message OppHistoryItemPreference {
  string id = 1;
  string destination_address = 2;
  int32 item_count = 3;
  string state = 4;
  int64 created_at_millis = 5;
  string summary = 6;
}
