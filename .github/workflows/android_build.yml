name: Android Build CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feat/ts18-peripheral-manager

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK API 36
        env:
          ANDROID_COMPILE_SDK: "36"
        run: |
          sdkmanager "platform-tools" "platforms;android-${ANDROID_COMPILE_SDK}"

      - name: Unit tests
        run: ./gradlew testStandardDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintStandardDebug --stacktrace

      - name: Manifest permission checks
        run: sh scripts/check-manifest-permissions.sh

      - name: Assemble standard debug
        run: ./gradlew assembleStandardDebug --stacktrace

      - name: Assemble standard release
        run: ./gradlew assembleStandardRelease --stacktrace

      - name: Assemble TS18 privileged debug
        run: ./gradlew assembleTs18PrivilegedDebug --stacktrace

      - name: Assemble TS18 privileged release
        run: ./gradlew assembleTs18PrivilegedRelease --stacktrace

      - name: Package Magisk module
        run: sh scripts/package-magisk.sh

      - name: Validate Magisk package
        run: sh scripts/validate-magisk-package.sh
