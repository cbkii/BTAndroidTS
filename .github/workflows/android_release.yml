name: Android Release APK

on:
  workflow_dispatch:
    inputs:
      version_label:
        description: Optional label for artifact/release naming
        required: false
        default: manual
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read
  checks: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      JAVA_VERSION: '17'
      JAVA_DISTRIBUTION: temurin
      ANDROID_COMPILE_SDK: '36'
      ANDROID_BUILD_TOOLS: '36.0.0'
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Validate workflow and script syntax
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; ARGV.each { |f| Psych.safe_load(File.read(f), permitted_classes: [], permitted_symbols: [], aliases: false); puts "OK #{f}" }' .github/workflows/*.yml
          find scripts -type f -name '*.sh' -print -exec bash -n {} \;

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: "platform-tools build-tools;${{ env.ANDROID_BUILD_TOOLS }} platforms;android-${{ env.ANDROID_COMPILE_SDK }}"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${sdk_root}" ]]; then
            echo "::error::ANDROID_HOME/ANDROID_SDK_ROOT is not set."
            exit 1
          fi
          printf 'sdk.dir=%s\n' "${sdk_root}" > local.properties
          echo "${sdk_root}/build-tools/${ANDROID_BUILD_TOOLS}" >> "${GITHUB_PATH}"
          test -x "${sdk_root}/build-tools/${ANDROID_BUILD_TOOLS}/aapt"
          test -x "${sdk_root}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"
          test -x "${sdk_root}/build-tools/${ANDROID_BUILD_TOOLS}/zipalign"

      - name: Ensure release signing material
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/keystore"

          store_file_name="btandroidts-release.jks"
          store_path="${HOME}/keystore/${store_file_name}"

          have_real_signing=false
          if [[ -n "${KEYSTORE_BASE64:-}" && -n "${KEYSTORE_PASSWORD:-}" && -n "${KEY_ALIAS:-}" && -n "${KEY_PASSWORD:-}" ]]; then
            have_real_signing=true
          fi

          if [[ "${have_real_signing}" == "true" ]]; then
            printf '%s' "${KEYSTORE_BASE64}" | base64 -d > "${store_path}"
            store_password="${KEYSTORE_PASSWORD}"
            key_alias="${KEY_ALIAS}"
            key_password="${KEY_PASSWORD}"
            signing_source="repository-secret"
          else
            echo "::warning::Release signing secrets are not fully configured. Generating a CI-only signing key. APKs will be installable but not suitable for stable upgrade continuity."
            store_password="btandroidts-ci-store-pass"
            key_alias="btandroidts-ci"
            key_password="btandroidts-ci-key-pass"
            signing_source="generated-ci-key"
            keytool -genkeypair \
              -keystore "${store_path}" \
              -storepass "${store_password}" \
              -alias "${key_alias}" \
              -keypass "${key_password}" \
              -keyalg RSA \
              -keysize 4096 \
              -validity 10000 \
              -dname "CN=BTAndroidTS CI Release,O=cbkii,C=NZ"
          fi

          cat > keystore.properties <<EOF
          STORE_FILE_NAME=${store_file_name}
          STORE_PASSWORD=${store_password}
          KEY_ALIAS=${key_alias}
          KEY_PASSWORD=${key_password}
          EOF

          chmod 600 keystore.properties "${store_path}"
          echo "source=${signing_source}" >> "${GITHUB_OUTPUT}"

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace --warning-mode all :app:testStandardDebugUnitTest

      - name: Android lint
        run: ./gradlew --no-daemon --stacktrace --warning-mode all :app:lintStandardRelease

      - name: Manifest permission checks
        run: sh scripts/check-manifest-permissions.sh

      - name: Build signed release APKs
        run: ./gradlew --no-daemon --stacktrace --warning-mode all :app:assembleStandardRelease :app:assembleTs18PrivilegedRelease

      - name: Validate signed release APKs
        id: validate_apks
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/validate-release-apks.sh
          {
            echo "standard_apk=$(find app/build/outputs/apk/standard/release -maxdepth 1 -type f -name '*.apk' ! -name '*unsigned*' | sort | tail -n 1)"
            echo "ts18_apk=$(find app/build/outputs/apk/ts18Privileged/release -maxdepth 1 -type f -name '*.apk' ! -name '*unsigned*' | sort | tail -n 1)"
          } >> "${GITHUB_OUTPUT}"

      - name: Package release Magisk module
        id: package_magisk
        shell: bash
        run: |
          set -euo pipefail
          ts18_apk="${{ steps.validate_apks.outputs.ts18_apk }}"
          if [[ -z "${ts18_apk}" || ! -f "${ts18_apk}" ]]; then
            echo "::error::Signed TS18 privileged release APK not found."
            exit 1
          fi
          bash scripts/package-magisk.sh "${ts18_apk}" "release-ci"
          bash scripts/validate-magisk-package.sh
          unzip -t build/BTAndroidTS-release-ci-magisk.zip
          echo "magisk_zip=build/BTAndroidTS-release-ci-magisk.zip" >> "${GITHUB_OUTPUT}"

      - name: Upload release APKs
        id: release_apks_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: btandroidts-release-apks
          path: |
            app/build/outputs/apk/standard/release/*.apk
            app/build/outputs/apk/ts18Privileged/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release Magisk module
        id: release_magisk_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: btandroidts-release-magisk-module
          path: ${{ steps.package_magisk.outputs.magisk_zip }}
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release for tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          gh release create "${tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "BTAndroidTS ${tag}" \
            --generate-notes \
            "${{ steps.validate_apks.outputs.standard_apk }}" \
            "${{ steps.validate_apks.outputs.ts18_apk }}" \
            "${{ steps.package_magisk.outputs.magisk_zip }}"

      - name: Write release summary
        if: always()
        shell: bash
        run: |
          {
            echo "# BTAndroidTS release APK workflow"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Signing source: \`${{ steps.signing.outputs.source }}\`"
            echo "- Standard APK: \`${{ steps.validate_apks.outputs.standard_apk }}\`"
            echo "- TS18 privileged APK: \`${{ steps.validate_apks.outputs.ts18_apk }}\`"
            echo "- Magisk ZIP: \`${{ steps.package_magisk.outputs.magisk_zip }}\`"
            echo
            if [[ "${{ steps.signing.outputs.source }}" == "generated-ci-key" ]]; then
              echo "⚠️ APKs are installable but signed with a generated CI-only key. Configure release signing secrets before publishing stable releases."
            else
              echo "✅ APKs were signed with repository release signing secrets."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
